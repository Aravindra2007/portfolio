<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jaguar AI UI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    background:#020617;
    color:#fff;
    overflow-x:hidden;
}

/* PARTICLE CANVAS */
#bg-canvas{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-2;
}

/* CURSOR LIGHT */
.cursor-light{
    position:fixed;
    width:350px;
    height:350px;
    border-radius:50%;
    pointer-events:none;
    background: radial-gradient(circle, rgba(0,255,200,0.25), transparent 70%);
    filter: blur(70px);
    transform: translate(-50%, -50%);
    z-index:0;
}

/* GRID */
body::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:
        linear-gradient(rgba(0,255,200,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,200,0.05) 1px, transparent 1px);
    background-size:40px 40px;
    z-index:-1;
}

/* NAVBAR */
.navbar{
    display:flex;
    justify-content:space-between;
    padding:20px 60px;
}

.logo{
    color:#00ffc3;
    text-shadow:0 0 10px #00ffc3;
    font-size: 1.5rem;
    cursor: pointer;
}

.nav-links a{
    color:#aaa;
    margin:0 15px;
    text-decoration:none;
    font-weight: 400;
}

.nav-links a:hover{
    color:#00ffc3;
    text-shadow:0 0 10px #00ffc3;
}

/* HERO */
.hero{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:60px;
}

.hero-text h1{
    font-size:40px;
    text-shadow:0 0 20px rgba(0,255,200,0.5);
}

.line{
    width:80px;
    height:2px;
    background:#00ffc3;
    margin:20px 0;
    box-shadow:0 0 10px #00ffc3;
}

/* BUTTONS */
.btn{
    padding:10px 18px;
    border-radius:8px;
    border:1px solid #00ffc3;
    color:#00ffc3;
    margin-right:10px;
    text-decoration:none;
    position:relative;
    overflow:hidden;
}

.btn::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:#00ffc3;
    left:-100%;
    top:0;
    transition:0.4s;
    z-index:-1;
}

.btn:hover::before{
    left:0;
}

.btn:hover{
    color:#000;
    box-shadow:0 0 20px #00ffc3;
}

/* HERO IMAGE */
.img-wrapper{
    position:relative;
}

.img-wrapper::before{
    content:"";
    position:absolute;
    width:400px;
    height:400px;
    background: radial-gradient(circle, rgba(0,255,200,0.5), transparent 70%);
    filter:blur(100px);
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
}

.img-wrapper img{
    width:320px;
    animation: float 4s ease-in-out infinite;

    -webkit-mask-image: linear-gradient(to bottom, black 70%, transparent);
    mask-image: linear-gradient(to bottom, black 70%, transparent);
}

/* FLOAT */
@keyframes float{
    0%,100%{ transform:translateY(0);}
    50%{ transform:translateY(-20px);}
}

/* CARDS */
.section{
    padding:60px;
}

.card{
    margin:20px;
    padding:20px;
    border-radius:10px;
    border:1px solid rgba(0,255,200,0.3);
    background:rgba(0,255,200,0.03);
    backdrop-filter:blur(10px);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 0 25px rgba(0,255,200,0.4);
}

/* RESPONSIVE */
@media(max-width:900px){
    .hero{
        flex-direction:column;
        text-align:center;
    }

    .navbar{
        flex-direction:column;
        gap:20px;
        text-align:center;
    }

    .logo{
        margin-bottom:10px;
    }
}
</style>
</head>

<body>

<!-- BACKGROUND -->
<canvas id="bg-canvas"></canvas>

<!-- CURSOR LIGHT -->
<div class="cursor-light"></div>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo" onclick="window.location.href='index2.html'">🐆 Jaguar AI</div>
    <div class="nav-links">
        <a href="about.html">About</a>
        <a href="skills.html">Skills</a>
        <a href="projects.html">Projects</a>
        <a href="achievements.html">Achievements</a>
        <a href="contact.html">Contact</a>
    </div>
</div>

<!-- HERO -->
<div class="hero">
    <div class="hero-text">
        <h1>Jaguar AI Interface</h1>
        <div class="line"></div>
        <p>Next-gen intelligent assistant with futuristic UI.</p>

        <div>
            <a href="projects.html" class="btn">View Projects</a>
            <a href="about.html" class="btn">About Me</a>
        </div>
    </div>

    <div class="img-wrapper">
        <!-- USE PNG CUTOUT -->
        <img src="resu1.png">
    </div>
</div>

<!-- SECTION -->
<div class="section">
    <div class="card">⚡ AI Powered Assistant</div>
    <div class="card">🧠 Smart Voice Recognition</div>
    <div class="card">🚀 Real-time Intelligence</div>
</div>

<script>
/* CURSOR LIGHT */
const light = document.querySelector('.cursor-light');
let mouseX=0, mouseY=0, currentX=0, currentY=0;

document.addEventListener('mousemove',(e)=>{
    mouseX=e.clientX;
    mouseY=e.clientY;
});

function animateLight(){
    currentX += (mouseX-currentX)*0.1;
    currentY += (mouseY-currentY)*0.1;
    light.style.left=currentX+"px";
    light.style.top=currentY+"px";
    requestAnimationFrame(animateLight);
}
animateLight();

/* PARTICLES */
const canvas=document.getElementById("bg-canvas");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];
for(let i=0;i<80;i++){
    particles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        vx:(Math.random()-0.5),
        vy:(Math.random()-0.5)
    });
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles.forEach(p=>{
        p.x+=p.vx;
        p.y+=p.vy;

        if(p.x<0||p.x>canvas.width)p.vx*=-1;
        if(p.y<0||p.y>canvas.height)p.vy*=-1;

        ctx.beginPath();
        ctx.arc(p.x,p.y,2,0,Math.PI*2);
        ctx.fillStyle="#00ffc3";
        ctx.fill();
    });

    for(let i=0;i<particles.length;i++){
        for(let j=i;j<particles.length;j++){
            let dx=particles[i].x-particles[j].x;
            let dy=particles[i].y-particles[j].y;
            let dist=dx*dx+dy*dy;

            if(dist<12000){
                ctx.beginPath();
                ctx.strokeStyle="rgba(0,255,200,0.15)";
                ctx.moveTo(particles[i].x,particles[i].y);
                ctx.lineTo(particles[j].x,particles[j].y);
                ctx.stroke();
            }
        }
    }

    requestAnimationFrame(draw);
}
draw();

window.addEventListener("resize",()=>{
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight);
});
</script>

</body>
</html>
